<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dorini Arquitetura — Gestão de Projetos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a}
body{padding:1.5rem;display:flex;flex-direction:column}

/* Login */
#login-screen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:999999}
#login-box{display:flex;flex-direction:column;align-items:center;gap:20px;width:320px;max-width:92vw}
#login-box .lt{font-size:11px;font-weight:600;letter-spacing:0.14em;color:#aaa;text-transform:uppercase}
#login-box .ls{font-size:22px;font-weight:300;color:#1a1a1a}
#login-box input{width:100%;padding:12px 14px;font-size:14px;border:0.5px solid #ddd;border-radius:10px;outline:none;color:#1a1a1a;background:#fafafa}
#login-box input:focus{border-color:#1a1a1a;background:#fff}
#login-box input.err{border-color:#E24B4A}
#login-box .lbtn{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer}
#login-box .lbtn:hover{opacity:0.85}
#login-box .lerr{font-size:12px;color:#E24B4A;min-height:16px;text-align:center}

/* App */
#gantt-app{width:100%;flex:1;display:flex;flex-direction:column}
#g-studio-name{font-size:11px;font-weight:600;letter-spacing:0.12em;color:#aaa;text-transform:uppercase}
.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.toolbar-label{font-size:12px;font-weight:500;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-size:12px;padding:5px 10px;border:0.5px solid #ccc;border-radius:8px;background:transparent;color:#1a1a1a;cursor:pointer;line-height:1.4;white-space:nowrap}
.btn:hover{background:#f5f5f5}
.btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{opacity:0.85}

.gantt-outer{border:0.5px solid #e0e0e0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;width:100%;flex:1}
.gantt-header-row{display:flex;border-bottom:0.5px solid #e0e0e0;flex-shrink:0}
.fixed-head{flex-shrink:0;background:#f9f9f7;border-right:0.5px solid #ccc}
.scroll-head-wrap{flex:1;overflow:hidden;min-width:0}
.scroll-head{overflow-x:hidden}
.gantt-body-area{display:flex;flex:1;min-height:0}
.fixed-body{flex-shrink:0;border-right:0.5px solid #ccc;overflow:hidden}
.scroll-body-wrap{flex:1;overflow-x:auto;overflow-y:auto;min-width:0;-webkit-overflow-scrolling:touch}
.scroll-body{position:relative}

.fixed-head table,.fixed-body table,.scroll-head table,.scroll-body table{border-collapse:collapse;table-layout:fixed}
thead th{font-size:11px;font-weight:500;color:#888;padding:6px 8px;background:#f9f9f7;text-align:left;white-space:nowrap;overflow:hidden;height:28px}
thead th.center{text-align:center}
.group-th{border-right:0.5px solid #e0e0e0}
tbody tr{border-bottom:0.5px solid #ebebeb}
tbody tr:last-child{border-bottom:none}
.proj-row:hover td{background:#f9f9f7}
.sub-row td{background:#f9f9f7}
td{padding:4px 8px;vertical-align:middle;font-size:12px;color:#1a1a1a;overflow:hidden;height:36px}

.name-cell{display:flex;align-items:center;gap:4px}
.toggle-btn{background:none;border:none;cursor:pointer;color:#999;padding:0;line-height:1;flex-shrink:0;font-size:11px;width:16px;text-align:center}
.name-text{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.name-text:hover{color:#185FA5}
.owner-tag{font-size:10px;color:#aaa;flex-shrink:0;margin-left:2px;white-space:nowrap}
.sub-name{font-size:12px;color:#888;padding-left:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:block}
.sub-name:hover{color:#1a1a1a}
.add-sub-btn{font-size:11px;padding:2px 7px;border:0.5px dashed #ccc;border-radius:8px;background:transparent;color:#aaa;cursor:pointer;margin-left:22px}
.add-sub-btn:hover{background:#fff;color:#1a1a1a}

.status-badge{font-size:10px;padding:2px 6px;border-radius:20px;white-space:nowrap;display:inline-block}
.s-ok{background:#EAF3DE;color:#3B6D11}
.s-prog{background:#E6F1FB;color:#185FA5}
.s-wait{background:#F1EFE8;color:#5F5E5A}
.s-late{background:#FCEBEB;color:#A32D2D}

.bar-cell{position:relative;padding:0;overflow:hidden}
.bar-inner{position:relative;height:36px;overflow:hidden}
.bar-bg{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:4px;cursor:grab;user-select:none;display:flex;align-items:center;padding:0 6px;font-size:11px;font-weight:500;white-space:nowrap;z-index:2}
.bar-bg:active{cursor:grabbing;opacity:0.85}
.handle-l,.handle-r{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:3}
.handle-l{left:0}.handle-r{right:0}
.today-line{position:absolute;top:0;bottom:0;width:1.5px;background:#D85A30;pointer-events:none;z-index:4}
.grid-line{position:absolute;top:0;bottom:0;width:0.5px;background:#ebebeb;pointer-events:none}

#g-arrow-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arrow-line{stroke:#999;stroke-width:1.5;fill:none;stroke-dasharray:4,3}
.arrow-head{fill:#999}

@media(max-width:600px){
  .col-status-cell{display:none}
  .owner-tag{display:none}
  .toolbar-label{display:none}
  body{padding:0.75rem}
}

/* Modal */
#gantt-modal{position:fixed;inset:0;background:rgba(0,0,0,0.28);display:flex;align-items:center;justify-content:center;z-index:99999}
.modal{background:#fff;border:0.5px solid #ccc;border-radius:12px;padding:1.5rem;width:360px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.modal h3{font-size:14px;font-weight:600;margin-bottom:1.25rem;color:#1a1a1a}
.field{margin-bottom:12px}
.field label{font-size:11px;color:#888;display:block;margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;outline:none}
.field input:focus,.field select:focus{border-color:#1a1a1a}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.delete-btn{margin-right:auto;color:#A32D2D;border:0.5px solid #F7C1C1;background:transparent;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}
.delete-btn:hover{background:#FCEBEB}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div id="login-box">
    <div class="lt">DORINI ARQUITETURA</div>
    <div class="ls">Gestão de Projetos</div>
    <input id="login-input" type="password" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="lbtn" onclick="doLogin()">Entrar</button>
    <div class="lerr" id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="gantt-app" style="display:none">
  <div class="toolbar">
    <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:80px">
      <span id="g-studio-name">DORINI ARQUITETURA</span>
      <span class="toolbar-label" id="g-range-label"></span>
    </div>
    <button class="btn" id="sc-day" onclick="setScale('day')">Dia</button>
    <button class="btn" id="sc-week" onclick="setScale('week')">Semana</button>
    <button class="btn" id="sc-month" onclick="setScale('month')">Mês</button>
    <button class="btn" onclick="shiftView(-1)">&#8249;</button>
    <button class="btn" onclick="goToday()">Hoje</button>
    <button class="btn" onclick="shiftView(1)">&#8250;</button>
    <button class="btn btn-primary" onclick="openModal('project',null,null)">+ Projeto</button>
  </div>
  <div class="gantt-outer">
    <div class="gantt-header-row">
      <div class="fixed-head" id="fixed-head">
        <table><thead id="fixed-head-rows"></thead></table>
      </div>
      <div class="scroll-head-wrap">
        <div class="scroll-head" id="scroll-head">
          <table id="head-table"><thead id="gantt-head"></thead></table>
        </div>
      </div>
    </div>
    <div class="gantt-body-area">
      <div class="fixed-body" id="fixed-body">
        <table id="fixed-body-table"><tbody id="fixed-body-rows"></tbody></table>
      </div>
      <div class="scroll-body-wrap" id="scroll-body-wrap">
        <div class="scroll-body" id="scroll-body">
          <table id="scroll-body-table"><tbody id="scroll-body-rows"></tbody></table>
          <svg id="arrow-svg"></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="gantt-modal" style="display:none">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="field"><label>Nome</label><input id="f-name" type="text"/></div>
    <div class="field"><label>Início</label><input id="f-start" type="date" oninput="calcEnd()"/></div>
    <div class="field-row">
      <div class="field"><label>Duração (dias)</label><input id="f-duration" type="number" min="1" placeholder="ex: 30" oninput="calcEnd()"/></div>
      <div class="field"><label>Término</label><input id="f-end" type="date" oninput="calcDuration()"/></div>
    </div>
    <div class="field"><label>Status</label>
      <select id="f-status">
        <option value="prog">Em andamento</option>
        <option value="ok">Concluído</option>
        <option value="wait">Aguardando</option>
        <option value="late">Atrasado</option>
      </select>
    </div>
    <div class="field" id="f-owner-wrap"><label>Responsável</label><input id="f-owner" type="text"/></div>
    <div class="field"><label>Predecessora</label><select id="f-pred"><option value="">— Nenhuma —</option></select></div>
    <div class="modal-actions">
      <button class="delete-btn" id="btn-delete" style="display:none" onclick="deleteItem()">&#10005; Excluir</button>
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveItem()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── LOGIN ────────────────────────────────────────────────
const PWD = '@DoriniGantt26';
function doLogin(){
  const v = document.getElementById('login-input').value;
  if(v === PWD){
    sessionStorage.setItem('da','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('gantt-app').style.display='flex';
    load(); updateScaleBtns(); render();
  } else {
    const inp = document.getElementById('login-input');
    document.getElementById('login-err').textContent = 'Senha incorreta.';
    inp.classList.add('err'); inp.value='';
    setTimeout(()=>inp.classList.remove('err'),400);
  }
}
document.getElementById('login-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(sessionStorage.getItem('da')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('gantt-app').style.display='flex';
}

// ── CONSTANTS ────────────────────────────────────────────
const COLORS={prog:['#B5D4F4','#042C53'],ok:['#C0DD97','#173404'],wait:['#D3D1C7','#2C2C2A'],late:['#F7C1C1','#501313']};
const SUB_C={prog:'#378ADD',ok:'#639922',wait:'#888780',late:'#E24B4A'};
const SL={prog:'Em andamento',ok:'Concluído',wait:'Aguardando',late:'Atrasado'};
const SC={prog:'s-prog',ok:'s-ok',wait:'s-wait',late:'s-late'};
const KEY='gantt_dorini_v1';

// ── STATE ────────────────────────────────────────────────
let projects=[], collapsed={}, viewStart=null, scale='week';
let _mode=null, _pid=null, _sid=null;

// ── DRAG STATE (global, registered once) ─────────────────
let drag=null;

// ── HELPERS ──────────────────────────────────────────────
function toIso(d){return d.toISOString().slice(0,10);}
function daysFrom(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

function getColWidths(){
  const w=document.getElementById('gantt-app').offsetWidth;
  if(w<500)return{name:140,status:0};
  if(w<700)return{name:160,status:0};
  return{name:185,status:95};
}
function getScaleCfg(){
  const appW=document.getElementById('gantt-app').offsetWidth;
  const cols=getColWidths();
  const avail=Math.max(appW-cols.name-cols.status-2,200);
  const mob=appW<500;
  const du=mob?20:30, wu=mob?16:24, mu=12;
  return{
    day:{ud:1,  px:Math.max(mob?22:28,avail/du), u:du, fmtU:d=>d.getDate()+'',       fmtG:d=>d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'}), gb:'month'},
    week:{ud:7, px:Math.max(mob?38:52,avail/wu), u:wu, fmtU:d=>{const m=('0'+(d.getMonth()+1)).slice(-2);return d.getDate()+'/'+m;}, fmtG:d=>d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'}), gb:'month'},
    month:{ud:30,px:Math.max(mob?52:64,avail/mu),u:mu, fmtU:d=>d.toLocaleDateString('pt-BR',{month:'short'}), fmtG:d=>''+d.getFullYear(), gb:'year'}
  };
}
function getUnits(){
  const c=getScaleCfg()[scale], units=[];
  let cur=new Date(viewStart);
  for(let i=0;i<c.u;i++){units.push(new Date(cur));cur.setDate(cur.getDate()+c.ud);}
  return units;
}
function pxFor(date,units){
  const c=getScaleCfg()[scale];
  return daysFrom(units[0],date)*(c.px/c.ud);
}
function buildGroups(units){
  const c=getScaleCfg()[scale], g=[];
  units.forEach(u=>{
    const key=c.gb==='month'?(u.getFullYear()*100+u.getMonth()):u.getFullYear();
    const lbl=c.fmtG(u);
    if(!g.length||g[g.length-1].key!==key)g.push({key,lbl,n:1});
    else g[g.length-1].n++;
  });
  return g;
}

// ── DATA ─────────────────────────────────────────────────
function defProjects(){
  const y=new Date().getFullYear();
  return[
    {id:1,name:'Residência Silva',start:`${y}-01-15`,end:`${y}-05-30`,status:'ok',owner:'Ana P.',pred:null,subs:[
      {id:11,name:'Levantamento',start:`${y}-01-15`,end:`${y}-02-10`,status:'ok',pred:null},
      {id:12,name:'Projeto arq.',start:`${y}-02-11`,end:`${y}-04-15`,status:'ok',pred:'s_1_11'},
      {id:13,name:'Aprovação',start:`${y}-04-16`,end:`${y}-05-30`,status:'ok',pred:'s_1_12'}
    ]},
    {id:2,name:'Comercial Centro',start:`${y}-03-01`,end:`${y}-09-15`,status:'prog',owner:'Carlos M.',pred:null,subs:[
      {id:21,name:'Estudo preliminar',start:`${y}-03-01`,end:`${y}-04-20`,status:'ok',pred:null},
      {id:22,name:'Anteprojeto',start:`${y}-04-21`,end:`${y}-07-01`,status:'prog',pred:'s_2_21'},
      {id:23,name:'Proj. executivo',start:`${y}-07-02`,end:`${y}-09-15`,status:'wait',pred:'s_2_22'}
    ]},
    {id:3,name:'Reforma Cobertura',start:`${y}-04-10`,end:`${y}-07-20`,status:'prog',owner:'Ana P.',pred:null,subs:[]},
    {id:4,name:'Condomínio Leste',start:`${y}-06-01`,end:`${y+1}-02-28`,status:'wait',owner:'Rafael S.',pred:null,subs:[
      {id:41,name:'Viabilidade',start:`${y}-06-01`,end:`${y}-08-15`,status:'wait',pred:null}
    ]},
    {id:5,name:'Interiores Apt 42',start:`${y}-02-20`,end:`${y}-04-15`,status:'late',owner:'Julia R.',pred:null,subs:[]}
  ];
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);projects=d.projects;collapsed=d.collapsed||{};scale=d.scale||'week';}else throw 0;}
  catch{projects=defProjects();collapsed={};}
  if(!viewStart)setInitView();
}
function save(){localStorage.setItem(KEY,JSON.stringify({projects,collapsed,scale}));}
function setInitView(){
  const all=projects.flatMap(p=>[new Date(p.start),...(p.subs||[]).map(s=>new Date(s.start))]);
  const minD=all.length?new Date(Math.min(...all)):new Date();
  if(scale==='day'){viewStart=new Date(minD);viewStart.setDate(viewStart.getDate()-3);}
  else if(scale==='week'){viewStart=new Date(minD.getFullYear(),minD.getMonth()-1,1);}
  else{viewStart=new Date(minD.getFullYear(),0,1);}
}
function getItem(pid,sid){
  const p=projects.find(x=>x.id===pid);if(!p)return null;
  return sid==null?p:(p.subs||[]).find(s=>s.id===sid)||null;
}
function flatItems(excludeKey){
  const list=[];
  projects.forEach(p=>{
    if('p_'+p.id!==excludeKey)list.push({key:'p_'+p.id,label:p.name,item:p});
    (p.subs||[]).forEach(s=>{
      if('s_'+p.id+'_'+s.id!==excludeKey)list.push({key:'s_'+p.id+'_'+s.id,label:p.name+' › '+s.name,item:s});
    });
  });
  return list;
}
function getItemByKey(key){
  if(!key)return null;
  if(key.startsWith('p_')){const pid=+key.slice(2);return projects.find(x=>x.id===pid)||null;}
  const parts=key.split('_');const pid=+parts[1],sid=+parts[2];
  const p=projects.find(x=>x.id===pid);return p?(p.subs||[]).find(s=>s.id===sid)||null:null;
}

// ── NAVIGATION ───────────────────────────────────────────
function setScale(s){scale=s;viewStart=null;setInitView();updateScaleBtns();save();render();}
function shiftView(dir){
  const c=getScaleCfg()[scale];
  viewStart=new Date(viewStart.getTime()+dir*c.u*c.ud*0.5*86400000);
  render();
}
function goToday(){
  const c=getScaleCfg()[scale];
  const wrap=document.getElementById('scroll-body-wrap');
  const vpx=wrap.offsetWidth||300;
  const hd=Math.floor((vpx/2)/(c.px/c.ud));
  const today=new Date();today.setHours(0,0,0,0);
  viewStart=new Date(today);viewStart.setDate(viewStart.getDate()-hd);
  render();
  setTimeout(()=>{
    const units=getUnits();
    const tp=pxFor(today,units);
    const sc=Math.max(0,tp-vpx/2);
    wrap.scrollLeft=sc;
    document.getElementById('scroll-head').scrollLeft=sc;
  },50);
}
function updateScaleBtns(){
  ['day','week','month'].forEach(k=>document.getElementById('sc-'+k).classList.toggle('active',k===scale));
}

// ── RENDER ───────────────────────────────────────────────
function render(){
  const cfg=getScaleCfg()[scale];
  const cols=getColWidths();
  const showSt=cols.status>0;
  const fixedW=cols.name+(showSt?cols.status:0);
  const units=getUnits();
  const totalPx=units.length*cfg.px;
  const lastDate=new Date(units[units.length-1]);lastDate.setDate(lastDate.getDate()+cfg.ud-1);
  const today=new Date();today.setHours(0,0,0,0);
  const todayPx=pxFor(today,units);
  const groups=buildGroups(units);

  document.getElementById('g-range-label').textContent=
    units[0].toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})+
    ' – '+lastDate.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});

  // Fixed header
  document.getElementById('fixed-head-rows').innerHTML=
    `<tr><th style="width:${cols.name}px">Projeto / Tarefa</th>${showSt?`<th style="width:${cols.status}px">Status</th>`:''}</tr>`+
    `<tr><th style="width:${cols.name}px"></th>${showSt?`<th style="width:${cols.status}px"></th>`:''}</tr>`;

  // Scroll header
  const gr=groups.map(g=>`<th class="group-th center" colspan="${g.n}">${g.lbl}</th>`).join('');
  const ur=units.map((u,i)=>{
    const ng=i<units.length-1&&buildGroups([units[i],units[i+1]]).length>1;
    return`<th class="center${ng?' group-th':''}" style="width:${cfg.px}px;min-width:${cfg.px}px">${cfg.fmtU(u)}</th>`;
  }).join('');
  document.getElementById('head-table').style.minWidth=totalPx+'px';
  document.getElementById('head-table').style.width='100%';
  document.getElementById('gantt-head').innerHTML=`<tr>${gr}</tr><tr>${ur}</tr>`;

  const todayLine=todayPx>=0&&todayPx<=totalPx?`<div class="today-line" style="left:${todayPx}px"></div>`:'';
  const gridLines=units.map((_,i)=>`<div class="grid-line" style="left:${i*cfg.px}px"></div>`).join('');

  let fixedRows='', scrollRows='';

  function addRow(isProj,isSub,p,s){
    const rc=isProj?'proj-row':'sub-row';
    let nc='',stc='';
    if(isProj){
      const subs=p.subs||[];const open=!collapsed[p.id];
      nc=`<div class="name-cell">
        <button class="toggle-btn" onclick="toggleCollapse(${p.id})">${subs.length?(open?'&#9660;':'&#9654;'):'&ndash;'}</button>
        <span class="name-text" onclick="openModal('project',${p.id},null)" title="${p.name}">${p.name}</span>
        ${p.owner?`<span class="owner-tag">${p.owner}</span>`:''}
      </div>`;
      stc=`<span class="status-badge ${SC[p.status]}">${SL[p.status]}</span>`;
    }else if(isSub){
      nc=`<span class="sub-name" onclick="openModal('sub',${p.id},${s.id})" title="${s.name}">${s.name}</span>`;
      stc=`<span class="status-badge ${SC[s.status]}">${SL[s.status]}</span>`;
    }else{
      nc=`<button class="add-sub-btn" onclick="openModal('sub',${p.id},null)">+ subtarefa</button>`;
    }
    fixedRows+=`<tr class="${rc}"><td style="width:${cols.name}px;max-width:${cols.name}px">${nc}</td>${showSt?`<td class="col-status-cell" style="width:${cols.status}px">${stc}</td>`:''}</tr>`;

    let bar='';
    if(isProj){
      const lx=pxFor(p.start,units),rx=pxFor(new Date(new Date(p.end).getTime()+86400000),units);
      const w=Math.max(8,rx-lx);
      const vis=new Date(p.end)>=units[0]&&new Date(p.start)<=lastDate;
      const [bg,fg]=COLORS[p.status]||COLORS.wait;
      bar=vis?`<div class="bar-bg" data-pid="${p.id}" style="left:${lx}px;width:${w}px;background:${bg};color:${fg}">
        <div class="handle-l" data-pid="${p.id}" data-side="l"></div>
        <span style="pointer-events:none;overflow:hidden;text-overflow:ellipsis">${p.name}</span>
        <div class="handle-r" data-pid="${p.id}" data-side="r"></div>
      </div>`:'';
    }else if(isSub){
      const lx=pxFor(s.start,units),rx=pxFor(new Date(new Date(s.end).getTime()+86400000),units);
      const w=Math.max(6,rx-lx);
      const vis=new Date(s.end)>=units[0]&&new Date(s.start)<=lastDate;
      const sc2=SUB_C[s.status]||SUB_C.wait;
      bar=vis?`<div class="bar-bg" data-pid="${p.id}" data-sid="${s.id}" style="left:${lx}px;width:${w}px;background:${sc2};color:#fff;height:12px;cursor:grab">
        <div class="handle-l" data-pid="${p.id}" data-sid="${s.id}" data-side="l"></div>
        <div class="handle-r" data-pid="${p.id}" data-sid="${s.id}" data-side="r"></div>
      </div>`:'';
    }
    scrollRows+=`<tr class="${rc}"><td class="bar-cell" style="min-width:${totalPx}px;width:100%"><div class="bar-inner">${gridLines}${todayLine}${bar}</div></td></tr>`;
  }

  projects.forEach(p=>{
    const subs=p.subs||[];
    addRow(true,false,p,null);
    if(!collapsed[p.id]){subs.forEach(s=>addRow(false,true,p,s));addRow(false,false,p,null);}
  });

  document.getElementById('fixed-body-table').style.width=fixedW+'px';
  document.getElementById('scroll-body-table').style.minWidth=totalPx+'px';
  document.getElementById('scroll-body-table').style.width='100%';
  document.getElementById('fixed-body-rows').innerHTML=fixedRows;
  document.getElementById('scroll-body-rows').innerHTML=scrollRows;

  syncHeights();
  drawArrows(units,totalPx);
  bindDrag();
}

// ── SYNC HEIGHTS ─────────────────────────────────────────
function syncHeights(){
  const fr=document.getElementById('fixed-body-rows').rows;
  const sr=document.getElementById('scroll-body-rows').rows;
  for(let i=0;i<fr.length;i++){
    const h=Math.max(fr[i]?fr[i].offsetHeight:0,sr[i]?sr[i].offsetHeight:0);
    if(fr[i])fr[i].style.height=h+'px';
    if(sr[i])sr[i].style.height=h+'px';
  }
  const fh=document.getElementById('fixed-head').querySelector('table');
  const sh=document.getElementById('head-table');
  const hh=Math.max(fh.offsetHeight,sh.offsetHeight);
  fh.style.height=hh+'px';sh.style.height=hh+'px';
}

// ── ARROWS ───────────────────────────────────────────────
function drawArrows(units,totalPx){
  const svg=document.getElementById('arrow-svg');
  if(!svg)return;
  svg.innerHTML='';
  svg.style.width=totalPx+'px';

  const rowMap={};let ri=0;
  projects.forEach(p=>{
    rowMap['p_'+p.id]=ri++;
    if(!collapsed[p.id]){(p.subs||[]).forEach(s=>{rowMap['s_'+p.id+'_'+s.id]=ri++;});ri++;}
  });
  const rows=document.getElementById('scroll-body-rows').rows;
  const ROW_H=36;

  const allFlat=[];
  projects.forEach(p=>{
    allFlat.push({key:'p_'+p.id,item:p});
    if(!collapsed[p.id])(p.subs||[]).forEach(s=>allFlat.push({key:'s_'+p.id+'_'+s.id,item:s}));
  });

  allFlat.forEach(({key,item})=>{
    if(!item.pred)return;
    const pred=getItemByKey(item.pred);if(!pred)return;
    const fromR=rowMap[item.pred],toR=rowMap[key];
    if(fromR===undefined||toR===undefined)return;
    const fromEl=rows[fromR],toEl=rows[toR];
    if(!fromEl||!toEl)return;

    const x1=pxFor(new Date(pred.end).getTime()+86400000,units);
    const x2=pxFor(item.start,units);
    const y1=fromEl.offsetTop+ROW_H/2;
    const y2=toEl.offsetTop+ROW_H/2;
    const mid=(x1+x2)/2;

    let d;
    if(x2>x1+10){
      d=`M${x1},${y1} L${mid},${y1} L${mid},${y2} L${x2},${y2}`;
    }else{
      const ox=x1+14;
      d=`M${x1},${y1} L${ox},${y1} L${ox},${(y1+y2)/2} L${x2-14},${(y1+y2)/2} L${x2-14},${y2} L${x2},${y2}`;
    }
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);path.setAttribute('class','arrow-line');svg.appendChild(path);
    const arr=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arr.setAttribute('points',`${x2},${y2} ${x2-7},${y2-4} ${x2-7},${y2+4}`);
    arr.setAttribute('class','arrow-head');svg.appendChild(arr);
  });
}

// ── DRAG (bind once per render, global handlers registered once) ──
function bindDrag(){
  document.querySelectorAll('.bar-bg').forEach(bar=>{
    bar.onmousedown=e=>{
      if(e.target.classList.contains('handle-l')||e.target.classList.contains('handle-r'))return;
      e.preventDefault();
      const pid=+bar.dataset.pid,sid=bar.dataset.sid?+bar.dataset.sid:null;
      const item=getItem(pid,sid);if(!item)return;
      drag={pid,sid,mode:'move',startX:e.clientX,os:new Date(item.start),oe:new Date(item.end)};
    };
    bar.ontouchstart=e=>{
      if(e.target.classList.contains('handle-l')||e.target.classList.contains('handle-r'))return;
      const pid=+bar.dataset.pid,sid=bar.dataset.sid?+bar.dataset.sid:null;
      const item=getItem(pid,sid);if(!item)return;
      drag={pid,sid,mode:'move',startX:e.touches[0].clientX,os:new Date(item.start),oe:new Date(item.end)};
    };
  });
  document.querySelectorAll('.handle-l,.handle-r').forEach(h=>{
    h.onmousedown=e=>{
      e.preventDefault();e.stopPropagation();
      const pid=+h.dataset.pid,sid=h.dataset.sid?+h.dataset.sid:null;
      const item=getItem(pid,sid);if(!item)return;
      drag={pid,sid,mode:h.dataset.side,startX:e.clientX,os:new Date(item.start),oe:new Date(item.end)};
    };
    h.ontouchstart=e=>{
      e.stopPropagation();
      const pid=+h.dataset.pid,sid=h.dataset.sid?+h.dataset.sid:null;
      const item=getItem(pid,sid);if(!item)return;
      drag={pid,sid,mode:h.dataset.side,startX:e.touches[0].clientX,os:new Date(item.start),oe:new Date(item.end)};
    };
  });
}

// Global drag move/end — registered ONCE
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const cfg=getScaleCfg()[scale];
  const dx=Math.round((e.clientX-drag.startX)/(cfg.px/cfg.ud));
  const item=getItem(drag.pid,drag.sid);if(!item)return;
  if(drag.mode==='move'){
    const ns=new Date(drag.os);ns.setDate(ns.getDate()+dx);
    const ne=new Date(drag.oe);ne.setDate(ne.getDate()+dx);
    item.start=toIso(ns);item.end=toIso(ne);
  }else if(drag.mode==='l'){
    const ns=new Date(drag.os);ns.setDate(ns.getDate()+dx);
    if(ns<drag.oe)item.start=toIso(ns);
  }else{
    const ne=new Date(drag.oe);ne.setDate(ne.getDate()+dx);
    if(ne>drag.os)item.end=toIso(ne);
  }
  render();
});
window.addEventListener('mouseup',()=>{if(drag){save();drag=null;}});
window.addEventListener('touchmove',e=>{
  if(!drag)return;
  const cfg=getScaleCfg()[scale];
  const dx=Math.round((e.touches[0].clientX-drag.startX)/(cfg.px/cfg.ud));
  const item=getItem(drag.pid,drag.sid);if(!item)return;
  if(drag.mode==='move'){
    const ns=new Date(drag.os);ns.setDate(ns.getDate()+dx);
    const ne=new Date(drag.oe);ne.setDate(ne.getDate()+dx);
    item.start=toIso(ns);item.end=toIso(ne);
  }else if(drag.mode==='l'){
    const ns=new Date(drag.os);ns.setDate(ns.getDate()+dx);
    if(ns<drag.oe)item.start=toIso(ns);
  }else{
    const ne=new Date(drag.oe);ne.setDate(ne.getDate()+dx);
    if(ne>drag.os)item.end=toIso(ne);
  }
  render();
},{passive:true});
window.addEventListener('touchend',()=>{if(drag){save();drag=null;}});

// ── SCROLL SYNC ──────────────────────────────────────────
document.getElementById('scroll-body-wrap').addEventListener('scroll',function(){
  document.getElementById('scroll-head').scrollLeft=this.scrollLeft;
  document.getElementById('fixed-body').scrollTop=this.scrollTop;
});

// Ctrl/Cmd + scroll → navega timeline
document.getElementById('scroll-body-wrap').addEventListener('wheel',function(e){
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();
    const cfg=getScaleCfg()[scale];
    const days=e.deltaY>0?cfg.ud:-cfg.ud;
    const sx=this.scrollLeft;
    viewStart=new Date(viewStart.getTime()+days*86400000);
    render();
    setTimeout(()=>{
      document.getElementById('scroll-body-wrap').scrollLeft=sx;
      document.getElementById('scroll-head').scrollLeft=sx;
    },0);
  }
},{passive:false});

document.getElementById('fixed-body').addEventListener('wheel',function(e){
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();
    const cfg=getScaleCfg()[scale];
    const days=e.deltaY>0?cfg.ud:-cfg.ud;
    const sx=document.getElementById('scroll-body-wrap').scrollLeft;
    viewStart=new Date(viewStart.getTime()+days*86400000);
    render();
    setTimeout(()=>{
      document.getElementById('scroll-body-wrap').scrollLeft=sx;
      document.getElementById('scroll-head').scrollLeft=sx;
    },0);
  }else{
    document.getElementById('scroll-body-wrap').scrollTop+=e.deltaY;
  }
},{passive:false});

// ── COLLAPSE ─────────────────────────────────────────────
function toggleCollapse(id){collapsed[id]=!collapsed[id];save();render();}

// ── MODAL ────────────────────────────────────────────────
function calcEnd(){
  const s=document.getElementById('f-start').value;
  const d=parseInt(document.getElementById('f-duration').value);
  if(s&&d>0){const dt=new Date(s);dt.setDate(dt.getDate()+d-1);document.getElementById('f-end').value=toIso(dt);}
}
function calcDuration(){
  const s=document.getElementById('f-start').value,e=document.getElementById('f-end').value;
  if(s&&e){const d=daysFrom(s,e)+1;if(d>0)document.getElementById('f-duration').value=d;}
}

function openModal(mode,pid,sid){
  _mode=mode;_pid=pid;_sid=sid;
  const isEdit=pid&&(mode==='project'||(mode==='sub'&&sid));
  document.getElementById('modal-title').textContent=isEdit?(mode==='project'?'Editar projeto':'Editar subtarefa'):(mode==='project'?'Novo projeto':'Nova subtarefa');
  document.getElementById('btn-delete').style.display=isEdit?'inline-block':'none';
  document.getElementById('f-owner-wrap').style.display=mode==='project'?'block':'none';

  const item=isEdit?getItem(pid,sid):null;
  const t=toIso(new Date());
  document.getElementById('f-name').value=item?item.name:'';
  document.getElementById('f-start').value=item?item.start:t;
  document.getElementById('f-end').value=item?item.end:t;
  document.getElementById('f-duration').value=item?daysFrom(item.start,item.end)+1:'';
  document.getElementById('f-status').value=item?item.status:'wait';
  document.getElementById('f-owner').value=(item&&item.owner)||'';

  // Predecessor dropdown
  const excludeKey=mode==='project'?'p_'+pid:(pid&&sid?'s_'+pid+'_'+sid:null);
  const sel=document.getElementById('f-pred');
  sel.innerHTML='<option value="">— Nenhuma —</option>';
  flatItems(excludeKey).forEach(fi=>{
    const o=document.createElement('option');
    o.value=fi.key;o.textContent=fi.label;
    if(item&&item.pred===fi.key)o.selected=true;
    sel.appendChild(o);
  });

  document.getElementById('gantt-modal').style.display='flex';
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}
function closeModal(){document.getElementById('gantt-modal').style.display='none';}

function saveItem(){
  const name=document.getElementById('f-name').value.trim();if(!name)return;
  const data={
    name,
    start:document.getElementById('f-start').value,
    end:document.getElementById('f-end').value,
    status:document.getElementById('f-status').value,
    pred:document.getElementById('f-pred').value||null
  };
  if(_mode==='project'){
    if(_pid){Object.assign(projects.find(p=>p.id===_pid),data,{owner:document.getElementById('f-owner').value.trim()});}
    else{data.id=Date.now();data.owner=document.getElementById('f-owner').value.trim();data.subs=[];projects.push(data);}
  }else{
    const p=projects.find(x=>x.id===_pid);if(!p)return;if(!p.subs)p.subs=[];
    if(_sid){Object.assign(p.subs.find(s=>s.id===_sid),data);}
    else{data.id=Date.now();p.subs.push(data);}
  }
  save();closeModal();render();
}
function deleteItem(){
  if(_mode==='project'&&_pid)projects=projects.filter(p=>p.id!==_pid);
  else if(_mode==='sub'&&_pid&&_sid){const p=projects.find(x=>x.id===_pid);if(p)p.subs=(p.subs||[]).filter(s=>s.id!==_sid);}
  save();closeModal();render();
}
document.getElementById('gantt-modal').addEventListener('click',e=>{if(e.target===document.getElementById('gantt-modal'))closeModal();});

// ── RESIZE ───────────────────────────────────────────────
let rsz;
window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(render,150);});

// ── INIT ─────────────────────────────────────────────────
if(sessionStorage.getItem('da')==='1'){load();updateScaleBtns();render();}
</script>
